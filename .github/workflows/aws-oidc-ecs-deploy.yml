name: Deploy to AWS ECS via OIDC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: petshop-prod
  ECS_CLUSTER: petshop-prod-cluster
  ECS_SERVICE: petshop-prod-service
  ECS_TASK_DEFINITION: petshop-prod-task

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Java application
        run: ./mvnw clean package -DskipTests -Dlicense.skip=true

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push container image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update ECS task definition and deploy
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json > task-definition.json

          ruby -e "require 'json'; file = 'task-definition.json'; data = JSON.parse(File.read(file)); data.delete('taskDefinitionArn'); data.delete('revision'); data.delete('status'); data.delete('requiresAttributes'); data.delete('creationDate'); data.delete('compatibilities'); data.delete('registeredAt'); data.delete('registeredBy'); data['containerDefinitions'].each { |container| if container['name'] == 'app'; container['image'] = ENV['IMAGE_URI']; end }; File.write('new-task-definition.json', JSON.pretty_generate(data))" 

          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.revision' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$ECS_TASK_DEFINITION:$NEW_REVISION" \
            --force-new-deployment \
            --region "$AWS_REGION"
